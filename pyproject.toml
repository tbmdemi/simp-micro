[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auxforge"
version = "1.4.0"
description = "SIMP Topology Optimization for Periodic Material Microstructure Design"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AuxForge Team"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "nlopt>=2.7",
]
keywords = [
    "topology-optimization",
    "SIMP",
    "homogenization",
    "auxetic",
    "periodic-microstructure",
    "finite-element",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mechanical and Civil Engineering",
]

[project.urls]
Homepage = "https://github.com/tbmdemi/simp-micro"
Documentation = "https://github.com/tbmdemi/simp-micro#readme"
Repository = "https://github.com/tbmdemi/simp-micro"

[project.scripts]
simp = "simp.main:main"
simp-analysis = "analysis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
analysis = [
    "pandas>=2.0",
    "scikit-image>=0.20",
    "Pillow>=10.0",
    "seaborn>=0.13",
    # analysis/scripts/skfem_homogenization.py (Phase 8.1: đối chiếu FE độc
    # lập) - xem EXPERIMENT_LOG.md mục 2026-07-31.
    "scikit-fem>=10.0",
]
ml = [
    # Phase 3 (train/test split), Phase 4 (surrogate CNN), Phase 5 (cVAE).
    # Version đã dùng để train các checkpoint hiện có trong outputs/phase4,5
    # (2026-07-29): torch 2.12.0+cu130, scikit-learn 1.9.0 - xem
    # EXPERIMENT_LOG.md để biết version cụ thể nếu cần tái lập bit-for-bit.
    "torch>=2.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "Pillow>=10.0",
]
all = [
    "auxforge[dev,analysis,ml]",
]

[tool.setuptools.packages.find]
include = ["simp*", "analysis*"]

[tool.setuptools.package-data]
simp = ["*.html"]

[tool.black]
line-length = 79
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
